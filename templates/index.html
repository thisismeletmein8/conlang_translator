<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <title>Conlang Translator</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
    <p id="small">8t ang-FEI</p>
    <h1>Conlang Translator</h1>
    <form method="POST">
        <label for="input">Enter English text here</label>
        <input type="text" id="input" name="input">
        <label for="language">Choose a conlang:</label>
        <select name="conlang" id="language" required>
            <option value="pig_latin">Pig Latin</option>
            <option value="verdurian">Verdurian (in progress)</option>
        </select>
        <button type="submit">Submit English text</button>
    </form> 
    <form method="post">
        <label for="conlang_input">Enter conlang text here</label>
        <input type="text" id="conlang_input" name="conlang_input">
        <select name="conlang" id="language" required>
            <option value="verdurian">Verdurian</option>
        </select>
        <button type="submit">Submit conlang text</button>
    </form>
    <!-- Above it's getting the code and below it's displaying the result. -->

    {% if input %}
        You wrote <i>{{ input }}</i> <!-- It does say you wrote and then your translation result -->
    {% endif %}

    {% if result %}
        Your translation result is <i>{{ result }}</i>
    {% endif %}

    </body>
</html>
